spring.profiles.active=${SPRING_PROFILES_ACTIVE:sit}
spring.application.name=rd_machine
spring.config.import=optional:classpath:application-local.properties,optional:file:./config/application-local.properties
rd.log.path=${RD_LOG_PATH:./logs}
rd.log.name=${RD_LOG_NAME:rd_machine}

rd.ai.llm.api-key=${RD_AI_LLM_API_KEY:}
rd.ai.llm.base-url=${RD_AI_LLM_BASE_URL:https://openrouter.ai/api/v1}
rd.ai.llm.model=${RD_AI_LLM_MODEL:anthropic/claude-sonnet-4.6}

rd.ai.tts.api-key=${RD_AI_TTS_API_KEY:}
rd.ai.tts.ws-url=wss://dashscope.aliyuncs.com/api-ws/v1/realtime
rd.ai.tts.model=qwen3-tts-flash-realtime
rd.ai.tts.zh-voice=Maia
rd.ai.tts.en-voice=Aiden
rd.ai.tts.sample-rate=24000
rd.ai.tts.mode=server_commit
rd.ai.tts.response-format=pcm
rd.ai.tts.debug-log-upstream-events=${RD_AI_TTS_DEBUG_LOG_UPSTREAM_EVENTS:false}
rd.ai.tts.commit.min-length=8
rd.ai.tts.commit.max-length=28
rd.ai.tts.commit.max-wait-ms=250
rd.ai.tts.commit.soft-punctuation=,\uFF0C
rd.ai.tts.commit.hard-punctuation=.!?\u3002\uFF01\uFF1F
rd.ai.tts.session.max-active-sessions=128
rd.ai.tts.session.idle-timeout-ms=300000
