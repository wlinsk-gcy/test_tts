spring.profiles.active=${SPRING_PROFILES_ACTIVE:sit}
spring.application.name=rd_machine
spring.config.import=optional:classpath:application-local.properties,optional:file:./config/application-local.properties
rd.log.path=${RD_LOG_PATH:./logs}
rd.log.name=${RD_LOG_NAME:rd_machine}

rd.ai.llm.api-key=${RD_AI_LLM_API_KEY:}
rd.ai.llm.base-url=${RD_AI_LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
rd.ai.llm.model=${RD_AI_LLM_MODEL:qwen3.7-flash}

rd.ai.tts.api-key=${RD_AI_TTS_API_KEY:}
rd.ai.tts.ws-url=${RD_AI_TTS_WS_URL:wss://dashscope.aliyuncs.com/api-ws/v1/realtime}
rd.ai.tts.model=${RD_AI_TTS_MODEL:qwen-audio-3.0-tts-flash}
rd.ai.tts.zh-voice=${RD_AI_TTS_ZH_VOICE:longanhuan_v3.6}
rd.ai.tts.en-voice=${RD_AI_TTS_EN_VOICE:loongmary}
rd.ai.tts.sample-rate=24000
rd.ai.tts.response-format=pcm
rd.ai.tts.task-timeout-ms=${RD_AI_TTS_TASK_TIMEOUT_MS:60000}
rd.ai.tts.pool.max-total=${RD_AI_TTS_POOL_MAX_TOTAL:16}
rd.ai.tts.pool.borrow-timeout-ms=${RD_AI_TTS_POOL_BORROW_TIMEOUT_MS:3000}
rd.ai.tts.session.max-active-sessions=128
rd.ai.tts.session.idle-timeout-ms=300000

rd.ai.cosyvoice.api-key=${RD_AI_COSYVOICE_API_KEY:}
rd.ai.cosyvoice.ws-url=${RD_AI_COSYVOICE_WS_URL:wss://dashscope.aliyuncs.com/api-ws/v1/inference/}
rd.ai.cosyvoice.model=${RD_AI_COSYVOICE_MODEL:cosyvoice-v3-flash}
rd.ai.cosyvoice.sample-rate=${RD_AI_COSYVOICE_SAMPLE_RATE:22050}
rd.ai.cosyvoice.format=${RD_AI_COSYVOICE_FORMAT:pcm}
rd.ai.cosyvoice.zh-voice=${RD_AI_COSYVOICE_ZH_VOICE:longanhuan}
rd.ai.cosyvoice.en-voice=${RD_AI_COSYVOICE_EN_VOICE:longanyang}
rd.ai.cosyvoice.connect-timeout-ms=${RD_AI_COSYVOICE_CONNECT_TIMEOUT_MS:30000}
rd.ai.cosyvoice.task-timeout-ms=${RD_AI_COSYVOICE_TASK_TIMEOUT_MS:60000}
rd.ai.cosyvoice.stream-timeout-ms=${RD_AI_COSYVOICE_STREAM_TIMEOUT_MS:300000}
rd.ai.cosyvoice.pool.max-size=${RD_AI_COSYVOICE_POOL_MAX_SIZE:16}
rd.ai.cosyvoice.pool.acquire-timeout-ms=${RD_AI_COSYVOICE_POOL_ACQUIRE_TIMEOUT_MS:3000}
rd.ai.cosyvoice.pool.idle-ttl-ms=${RD_AI_COSYVOICE_POOL_IDLE_TTL_MS:55000}
